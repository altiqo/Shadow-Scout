[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-scout"
version = "1.1.0"
description = "Поиск небольших VPS-провайдеров под VPN с оценкой риска блокировки РКН"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shadow Scout contributors" }]
keywords = ["vps", "vpn", "rkn", "roskomnadzor", "asn", "blocklist", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Security",
]
dependencies = [
  "rich>=13.7",
  "questionary>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "platformdirs>=4.0",
  "reportlab>=4.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
shadow-scout = "shadow_scout.cli:main"

[tool.setuptools.packages.find]
include = ["shadow_scout*"]

[tool.setuptools.package-data]
shadow_scout = ["data/*.yaml", "data/*.json", "data/fonts/*.ttf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: тесты с реальной сетью (по умолчанию пропускаются; запуск: pytest -m network)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]
