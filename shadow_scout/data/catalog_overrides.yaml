# Ручные правки автоматического каталога (providers_auto.json). Применяются при каждом запуске «shadow-scout harvest»,
# поэтому исправления не пропадают при пересборке каталога.
#
# deny_asns:  сети, которые никогда не попадут в каталог (не хостинг, брокер, CDN, ложное срабатывание правил)
# force_asns: сети, которые попадут в каталог, даже если правила или проверка сайта их отвергли
# ru_asns:    помечаются как «связи с РФ» (по умолчанию из поиска исключаются)
# names:      ASN → отображаемое название
# locations:  ASN → список локаций вместо найденных по PeeringDB
# popularity: ASN → 1..5, насколько хостер известен русскоязычному VPN-сообществу (по умолчанию — по размеру сети)

