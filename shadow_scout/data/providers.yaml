# popularity_ru (1 — почти неизвестен в RU-сообществе, 5 — массово используется для VPN),
# ip_type (dch — датацентр, isp — провайдерские/резидентные пулы, mixed), trial, hourly,
# min_price_eur, payment, ru_ties (российские владельцы/юрлицо/офис), rkn_hoster_registry
